---
## ============================================================
## PXC TLS CERTIFICATE GENERATION
## ============================================================

  - name: Install OpenSSL
    ansible.builtin.package:
      name: openssl
      state: present

  - name: Create PXC certificate directory
    ansible.builtin.file:
      path: /etc/mysql/certs
      state: directory
      owner: mysql
      group: mysql
      mode: "0750"

## Generate CA only on Node 01
  - name: Generate PXC CA private key
    ansible.builtin.command:
      cmd: openssl genrsa -out /etc/mysql/certs/ca-key.pem 4096
      creates: /etc/mysql/certs/ca-key.pem
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Generate PXC self-signed CA certificate
    ansible.builtin.command:
      cmd: >
        openssl req
        -new
        -x509
        -nodes
        -days 3650
        -key /etc/mysql/certs/ca-key.pem
        -subj /C=CO/ST=Bogota/L=Bogota/O=PXC-Lab/OU=Database/CN=PXC-Cluster-CA
        -out /etc/mysql/certs/ca.pem
      creates: /etc/mysql/certs/ca.pem
    when: ansible_hostname in var_group['percona_node_01_short_name']

## Generate shared cluster server certificate on Node 01
  - name: Generate PXC server private key
    ansible.builtin.command:
      cmd: openssl genrsa -out /etc/mysql/certs/server-key.pem 4096
      creates: /etc/mysql/certs/server-key.pem
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Generate PXC server certificate request
    ansible.builtin.command:
      cmd: >
        openssl req
        -new
        -key /etc/mysql/certs/server-key.pem
        -subj /C=CO/ST=Bogota/L=Bogota/O=PXC-Lab/OU=Database/CN=PXC-Cluster
        -out /etc/mysql/certs/server-req.pem
      creates: /etc/mysql/certs/server-req.pem
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Sign PXC server certificate with cluster CA
    ansible.builtin.command:
      cmd: >
        openssl x509
        -req
        -in /etc/mysql/certs/server-req.pem
        -days 3650
        -CA /etc/mysql/certs/ca.pem
        -CAkey /etc/mysql/certs/ca-key.pem
        -CAcreateserial
        -sha256
        -out /etc/mysql/certs/server-cert.pem
      creates: /etc/mysql/certs/server-cert.pem
    when: ansible_hostname in var_group['percona_node_01_short_name']

## Permissions on Node 01
  - name: Set PXC CA private key permissions
    ansible.builtin.file:
      path: /etc/mysql/certs/ca-key.pem
      owner: mysql
      group: mysql
      mode: "0600"
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Set PXC server private key permissions
    ansible.builtin.file:
      path: /etc/mysql/certs/server-key.pem
      owner: mysql
      group: mysql
      mode: "0600"
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Set PXC CA certificate permissions
    ansible.builtin.file:
      path: /etc/mysql/certs/ca.pem
      owner: mysql
      group: mysql
      mode: "0644"
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Set PXC server certificate permissions
    ansible.builtin.file:
      path: /etc/mysql/certs/server-cert.pem
      owner: mysql
      group: mysql
      mode: "0644"
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Verify PXC server certificate
    ansible.builtin.command:
      cmd: >
        openssl verify
        -CAfile /etc/mysql/certs/ca.pem
        /etc/mysql/certs/server-cert.pem
    register: pxc_certificate_verify
    changed_when: false
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Display PXC certificate verification
    ansible.builtin.debug:
      var: pxc_certificate_verify.stdout
    when: ansible_hostname in var_group['percona_node_01_short_name']

## ============================================================
## FETCH CLUSTER CERTIFICATES TO ANSIBLE CONTROLLER
## ============================================================

  - name: Create temporary certificate directory on Ansible controller
    ansible.builtin.file:
      path: /tmp/pxc-cluster-certs
      state: directory
      mode: "0700"
    delegate_to: localhost
    become: false
    run_once: true

  - name: Fetch PXC CA certificate from Node 01
    ansible.builtin.fetch:
      src: /etc/mysql/certs/ca.pem
      dest: /tmp/pxc-cluster-certs/ca.pem
      flat: true
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Fetch PXC server certificate from Node 01
    ansible.builtin.fetch:
      src: /etc/mysql/certs/server-cert.pem
      dest: /tmp/pxc-cluster-certs/server-cert.pem
      flat: true
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Fetch PXC server private key from Node 01
    ansible.builtin.fetch:
      src: /etc/mysql/certs/server-key.pem
      dest: /tmp/pxc-cluster-certs/server-key.pem
      flat: true
    when: ansible_hostname in var_group['percona_node_01_short_name']

## ============================================================
## DISTRIBUTE CLUSTER CERTIFICATES
## ============================================================

  - name: Distribute PXC CA certificate
    ansible.builtin.copy:
      src: /tmp/pxc-cluster-certs/ca.pem
      dest: /etc/mysql/certs/ca.pem
      owner: mysql
      group: mysql
      mode: "0644"
    when:
      - ansible_hostname in var_group['percona_node_01_short_name'] or
        ansible_hostname in var_group['percona_node_02_short_name'] or
        ansible_hostname in var_group['percona_node_03_short_name']

  - name: Distribute PXC server certificate
    ansible.builtin.copy:
      src: /tmp/pxc-cluster-certs/server-cert.pem
      dest: /etc/mysql/certs/server-cert.pem
      owner: mysql
      group: mysql
      mode: "0644"
    when:
      - ansible_hostname in var_group['percona_node_01_short_name'] or
        ansible_hostname in var_group['percona_node_02_short_name'] or
        ansible_hostname in var_group['percona_node_03_short_name']

  - name: Distribute PXC server private key
    ansible.builtin.copy:
      src: /tmp/pxc-cluster-certs/server-key.pem
      dest: /etc/mysql/certs/server-key.pem
      owner: mysql
      group: mysql
      mode: "0600"
    when:
      - ansible_hostname in var_group['percona_node_01_short_name'] or
        ansible_hostname in var_group['percona_node_02_short_name'] or
        ansible_hostname in var_group['percona_node_03_short_name']

  - name: Restore SELinux context on PXC certificate directory
    ansible.builtin.command:
      cmd: restorecon -RFv /etc/mysql/certs
    changed_when: false
    when:
      - ansible_hostname in var_group['percona_node_01_short_name'] or
        ansible_hostname in var_group['percona_node_02_short_name'] or
        ansible_hostname in var_group['percona_node_03_short_name']

## ============================================================
## PXC ENCRYPTED CONFIGURATION
## ============================================================

  - name: Add J2 template for bootstrapper encrypted configuration Node 01
    ansible.builtin.template:
      src: templates/encryption-percona-node-01.cnf.j2
      dest: /etc/my.cnf
      owner: root
      group: root
      mode: "0644"
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Add J2 template for encrypted configuration Node 02
    ansible.builtin.template:
      src: templates/encryption-percona-node-02.cnf.j2
      dest: /etc/my.cnf
      owner: root
      group: root
      mode: "0644"
    when: ansible_hostname in var_group['percona_node_02_short_name']

  - name: Add J2 template for encrypted configuration Node 03
    ansible.builtin.template:
      src: templates/encryption-percona-node-03.cnf.j2
      dest: /etc/my.cnf
      owner: root
      group: root
      mode: "0644"
    when: ansible_hostname in var_group['percona_node_03_short_name']

## ============================================================
## SELINUX
## ============================================================

  - name: Set mysql_connect_any flag on and keep it persistent across reboots
    ansible.posix.seboolean:
      name: mysql_connect_any
      state: true
      persistent: true
    when: ansible_hostname in var_group['percona_node_01_short_name']

## ============================================================
## SYSTEMD
## ============================================================

  - name: System daemon reload
    ansible.builtin.systemd:
      daemon_reload: true
    when: ansible_hostname in var_group['percona_node_01_short_name']

## ============================================================
## BOOTSTRAP NODE 01
## ============================================================

  - name: Bootstrap PXC Node 01
    ansible.builtin.systemd:
      name: mysql@bootstrap.service
      state: started
    register: pxc_bootstrap
    when: ansible_hostname in var_group['percona_node_01_short_name']

## ============================================================
## ROOT PASSWORD
## ============================================================

  - name: Get temporary root password
    ansible.builtin.shell:
      cmd: grep 'temporary password' /var/log/mysqld.log | awk '{print $NF}' | tail -n 1
    register: temp_password
    changed_when: false
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Display temporary root password
    ansible.builtin.debug:
      msg: "{{ temp_password.stdout }}"
    when: ansible_hostname in var_group['percona_node_01_short_name']

  - name: Set Percona root password
    ansible.builtin.shell:
      cmd: >
        echo "ALTER USER 'root'@'localhost'
        IDENTIFIED BY '{{ secret.percona_root_password }}';
        FLUSH PRIVILEGES;" |
        mysql
        -u root
        --password='{{ temp_password.stdout }}'
        --connect-expired-password
    no_log: true
    when: ansible_hostname in var_group['percona_node_01_short_name']

## ============================================================
## MAXSCALE USER
## ============================================================

  - name: Create MaxScale user
    community.mysql.mysql_user:
      login_user: root
      login_password: "{{ secret.percona_root_password }}"
      login_unix_socket: /var/lib/mysql/mysql.sock
      name: maxscaleusr
      host: "%"
      plugin: caching_sha2_password
      plugin_auth_string: "{{ secret.percona_maxscaleusr_password }}"
      salt: "1234567890abcdefghij"
      priv: "*.*:ALL,GRANT"
      state: present
      update_password: on_create
      column_case_sensitive: true
    vars:
      ansible_python_interpreter: /usr/bin/python3
    no_log: true
    when: ansible_hostname in var_group['percona_node_01_short_name']
